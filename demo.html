<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App - Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      color: white;
      line-height: 1.5;
    }
    
    .gradient-bg {
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }
    
    .gradient-bg::before,
    .gradient-bg::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.1;
      animation: pulse 4s ease-in-out infinite;
    }
    
    .gradient-bg::before {
      top: 25%;
      left: 25%;
      width: 24rem;
      height: 24rem;
      background: #3b82f6;
    }
    
    .gradient-bg::after {
      bottom: 25%;
      right: 25%;
      width: 24rem;
      height: 24rem;
      background: #a855f7;
      animation-delay: 1s;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.1; transform: scale(1); }
      50% { opacity: 0.15; transform: scale(1.1); }
    }
    
    .glass {
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    header {
      position: relative;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .container {
      max-width: 80rem;
      margin: 0 auto;
      padding: 0 1.5rem;
    }
    
    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .icon-gradient {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 1rem;
      background: linear-gradient(135deg, #3b82f6 0%, #9333ea 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px -5px rgba(59, 130, 246, 0.25);
    }
    
    .btn-ghost {
      padding: 0.5rem 1rem;
      background: transparent;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      border-radius: 0.5rem;
      transition: all 0.2s;
    }
    
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.05);
      color: white;
    }
    
    main {
      position: relative;
      z-index: 10;
      padding: 2rem 0;
    }
    
    .quick-add {
      margin-bottom: 2rem;
    }
    
    .add-input {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1.25rem;
      border-radius: 2rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      transition: all 0.2s;
    }
    
    .add-input:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }
    
    .checkbox {
      width: 1.5rem;
      height: 1.5rem;
      border: 2px solid #6b7280;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    
    .checkbox:hover {
      border-color: #3b82f6;
      transform: scale(1.1);
    }
    
    .checkbox.checked {
      background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%);
      border-color: #4ade80;
      box-shadow: 0 4px 12px rgba(74, 222, 128, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    input {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 1rem;
      outline: none;
    }
    
    input::placeholder {
      color: #6b7280;
    }
    
    .filters {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .btn-filter {
      padding: 0.5rem 1rem;
      border-radius: 1rem;
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #9ca3af;
      transition: all 0.2s;
    }
    
    .btn-filter:hover {
      background: rgba(255, 255, 255, 0.05);
      color: white;
    }
    
    .btn-filter.active {
      background: linear-gradient(135deg, #3b82f6 0%, #9333ea 100%);
      color: white;
      box-shadow: 0 10px 30px -5px rgba(59, 130, 246, 0.25);
    }
    
    .tasks {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .task {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-radius: 2rem;
      transition: all 0.2s;
    }
    
    .task:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }
    
    .task-title {
      flex: 1;
      font-size: 1rem;
      cursor: pointer;
    }
    
    .task-title.completed {
      color: #6b7280;
      text-decoration: line-through;
    }
    
    .badge {
      padding: 0.25rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid;
    }
    
    .badge-high {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }
    
    .badge-med {
      background: rgba(250, 204, 21, 0.2);
      color: #facc15;
      border-color: rgba(250, 204, 21, 0.3);
    }
    
    .badge-low {
      background: rgba(59, 130, 246, 0.2);
      color: #3b82f6;
      border-color: rgba(59, 130, 246, 0.3);
    }
    
    .btn-delete {
      padding: 0.5rem;
      background: transparent;
      border: none;
      color: #6b7280;
      cursor: pointer;
      border-radius: 0.5rem;
      transition: all 0.2s;
    }
    
    .btn-delete:hover {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
    }
  </style>
</head>
<body>
  <div class="gradient-bg">
    <!-- Header -->
    <header class="glass">
      <div class="container">
        <div class="header-content">
          <div class="header-left">
            <div class="icon-gradient">
              <svg style="width: 1.25rem; height: 1.25rem; color: white;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <div>
              <h1 style="font-size: 1.25rem; font-weight: bold;">Inbox</h1>
              <div style="font-size: 0.75rem; color: #9ca3af;">3 active · 2 done</div>
            </div>
          </div>
          <button class="btn-ghost">Sign out</button>
        </div>
      </div>
    </header>

    <!-- Main -->
    <main class="container">
      <!-- Quick Add -->
      <div class="quick-add">
        <div class="add-input glass">
          <div class="checkbox"></div>
          <input type="text" placeholder="Add a task... (Press Enter)">
        </div>
      </div>

      <!-- Filters -->
      <div class="filters">
        <button class="btn-filter active">All</button>
        <button class="btn-filter">Active</button>
        <button class="btn-filter">Completed</button>
      </div>

      <!-- Tasks -->
      <div class="tasks">
        <div class="task glass">
          <div class="checkbox"></div>
          <span class="task-title">Design new landing page</span>
          <span class="badge badge-high">P1</span>
          <button class="btn-delete">
            <svg style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        </div>

        <div class="task glass">
          <div class="checkbox checked">
            <svg style="width: 1rem; height: 1rem; color: white;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <span class="task-title completed">Review pull requests</span>
          <span class="badge badge-med">P2</span>
          <button class="btn-delete">
            <svg style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        </div>

        <div class="task glass">
          <div class="checkbox"></div>
          <span class="task-title">Update documentation</span>
          <span class="badge badge-low">P3</span>
          <button class="btn-delete">
            <svg style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        </div>

        <div class="task glass">
          <div class="checkbox checked">
            <svg style="width: 1rem; height: 1rem; color: white;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <span class="task-title completed">Fix responsive issues</span>
          <span class="badge badge-high">P1</span>
          <button class="btn-delete">
            <svg style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        </div>

        <div class="task glass">
          <div class="checkbox"></div>
          <span class="task-title">Prepare demo presentation</span>
          <span class="badge badge-med">P2</span>
          <button class="btn-delete">
            <svg style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
